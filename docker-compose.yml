services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot
      SYNC_DATABASE_URL: postgresql://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD}
      DEFAULT_TENANT_KEY: ${DEFAULT_TENANT_KEY}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  celery-worker:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A tasks.celery_app worker -l info -c 2
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot
      SYNC_DATABASE_URL: postgresql://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A tasks.celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot
      SYNC_DATABASE_URL: postgresql://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  mcp-server:
    build: ./mcp-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_URL: http://backend:8000
      API_KEY: ${DEFAULT_TENANT_KEY}
    ports:
      - "${MCP_PORT:-8080}:8080"
    depends_on:
      - backend

  frontend:
    build: ./frontend
    depends_on:
      - backend

  nginx:
    build: ./nginx
    ports:
      - "${APP_PORT:-8501}:80"
    depends_on:
      - backend
      - frontend
