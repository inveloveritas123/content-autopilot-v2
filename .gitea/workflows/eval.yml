name: Eval Suite

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # nightly 02:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'mock or real'
        default: 'mock'

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml anthropic sqlalchemy

      - name: Run eval (mock mode for PRs)
        id: eval
        run: |
          MODE=mock
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=real
          fi
          if [ "${{ github.event.inputs.mode }}" != "" ]; then
            MODE="${{ github.event.inputs.mode }}"
          fi
          python tests/eval/run_eval.py --${MODE} --min-pass 80
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Comment PR result
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.eval.outcome }}';
            const body = outcome === 'success'
              ? '✅ Eval Suite: PASS (>=80%)'
              : '❌ Eval Suite: FAIL (<80%) -- PR blocked';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
