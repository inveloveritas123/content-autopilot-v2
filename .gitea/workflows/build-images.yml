name: Build & Push Container Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: sha-<short>)'
        required: false

env:
  REGISTRY: 10.10.0.1:3000
  IMAGE_PREFIX: 10.10.0.1:3000/meister/content-autopilot-v2

jobs:
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_PREFIX }}/backend
            ${{ env.IMAGE_PREFIX }}/mcp-server
            ${{ env.IMAGE_PREFIX }}/nginx
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build frontend (for nginx image)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build + Push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.ref_name == 'main' && 'main' || '' }}
            ${{ env.IMAGE_PREFIX }}/backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + Push mcp-server
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/mcp-server:${{ github.ref_name == 'main' && 'main' || '' }}
            ${{ env.IMAGE_PREFIX }}/mcp-server:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + Push nginx (with pre-built frontend)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile.v2
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/nginx:${{ github.ref_name == 'main' && 'main' || '' }}
            ${{ env.IMAGE_PREFIX }}/nginx:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release as latest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for service in backend mcp-server nginx; do
            docker pull ${{ env.IMAGE_PREFIX }}/${service}:sha-${{ github.sha }}
            docker tag ${{ env.IMAGE_PREFIX }}/${service}:sha-${{ github.sha }} \
              ${{ env.IMAGE_PREFIX }}/${service}:${{ github.ref_name }}
            docker tag ${{ env.IMAGE_PREFIX }}/${service}:sha-${{ github.sha }} \
              ${{ env.IMAGE_PREFIX }}/${service}:latest
            docker push ${{ env.IMAGE_PREFIX }}/${service}:${{ github.ref_name }}
            docker push ${{ env.IMAGE_PREFIX }}/${service}:latest
          done

      - name: Summary
        run: |
          echo "## Images gebaut & gepusht" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for service in backend mcp-server nginx; do
            echo "| ${service} | sha-${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          done
