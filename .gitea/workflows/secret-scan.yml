name: Secret Scan (gitleaks)

on:
  push:
    branches: ["**"]
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC on main
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for --log-opts scan

      - name: Run gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config-path: .gitleaks.toml
        continue-on-error: true

      - name: Auto-create issue on main-branch leak
        if: steps.gitleaks.outcome == 'failure' && github.ref == 'refs/heads/main'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"title\": \"🔴 [SEC] Secret-Leak auf main-Branch entdeckt (gitleaks)\",
              \"body\": \"Gitleaks hat auf Commit ${{ github.sha }} (Push von @${{ github.actor }}) auf \`main\` mögliche Secrets gefunden.\n\n**Sofortmaßnahmen:**\n1. Git-History bereinigen (BFG Repo-Cleaner oder git-filter-repo)\n2. Betroffene API-Keys rotieren\n3. Nochmals scannen\n\nWorkflow-Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"labels\": [\"security\"]
            }" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/issues"

      - name: Fail if secrets found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::gitleaks found secrets in this commit — see gitleaks output above"
          exit 1
