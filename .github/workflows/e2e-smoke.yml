name: E2E Smoke (Playwright)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-smoke:
    name: Playwright Smoke gegen lokalen Docker-Stack
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DB_PASSWORD: citestpw
      E2E_BASE_URL: http://localhost:8601
      E2E_API_KEY: ci-test-tenant-key

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python (fuer Alembic + Bootstrap)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Postgres-Client (fuer Bootstrap-Script)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build + Start Stack
        run: |
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml \
            up -d --build postgres-ci redis-v2 backend-v2 nginx-v2 celery-worker-v2 celery-beat-v2
          echo "Container hochgefahren — warte auf Health..."
          docker ps

      - name: Wait for Postgres
        timeout-minutes: 3
        run: |
          for i in {1..60}; do
            if docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml \
                exec -T postgres-ci pg_isready -U autopilot -d content_autopilot_v2 2>/dev/null; then
              echo "Postgres ready."
              break
            fi
            echo "Warte auf Postgres ($i/60)..."
            sleep 3
          done

      - name: Alembic-Migrations
        run: |
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml \
            exec -T backend-v2 alembic upgrade head

      - name: Bootstrap CI-Tenant
        env:
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          # Postgres-Container Port nach aussen freigeben temporaer? Nein —
          # wir nutzen exec im Container fuer das Bootstrap-Script.
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml \
            exec -T postgres-ci psql -U autopilot -d content_autopilot_v2 \
            -c "INSERT INTO tenants (id, api_key, name, created_at, updated_at) VALUES (gen_random_uuid(), '${{ env.E2E_API_KEY }}', 'CI Test Tenant', NOW(), NOW()) ON CONFLICT (api_key) DO NOTHING;"

      - name: Wait for /api/health
        timeout-minutes: 3
        run: |
          for i in {1..40}; do
            if curl -sf "${E2E_BASE_URL}/api/health" >/dev/null 2>&1; then
              curl -s "${E2E_BASE_URL}/api/health" | python3 -m json.tool
              echo "Health OK."
              break
            fi
            echo "Warte auf /api/health ($i/40)..."
            sleep 3
          done
          curl -sf "${E2E_BASE_URL}/api/health" || (echo "Health-Check FAIL"; exit 1)

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers (Chromium only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Smoke Tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright Report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright Traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 14

      - name: Dump Backend Logs on failure
        if: failure()
        run: |
          echo "::group::Backend logs"
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml logs backend-v2 --tail=200 || true
          echo "::endgroup::"
          echo "::group::nginx logs"
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml logs nginx-v2 --tail=100 || true
          echo "::endgroup::"

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml down -v
