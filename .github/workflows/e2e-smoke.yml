name: E2E Smoke (Playwright)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-smoke:
    name: Playwright Smoke gegen lokalen Docker-Stack
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DB_PASSWORD: citestpw
      E2E_BASE_URL: http://localhost:8601
      E2E_API_KEY: ci-test-tenant-key
      E2E_LOGIN_EMAIL: e2e-owner@ci-test.local
      E2E_LOGIN_PASSWORD: ci-test-password-2026
      NEXTCLOUD_PASSWORD: ci-placeholder
      NEXTCLOUD_DB_PASSWORD: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python (fuer Alembic + Bootstrap)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Postgres-Client (fuer Bootstrap-Script)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build Frontend (fuer nginx-Image)
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build + Start Stack
        run: |
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml \
            up -d --build postgres-ci redis-v2 backend-v2 nginx-v2 celery-worker-v2 celery-beat-v2
          echo "Container hochgefahren — warte auf Health..."
          docker ps

      - name: Wait for Postgres
        timeout-minutes: 3
        run: |
          for i in {1..60}; do
            if docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml \
                exec -T postgres-ci pg_isready -U autopilot -d content_autopilot_v2 2>/dev/null; then
              echo "Postgres ready."
              break
            fi
            echo "Warte auf Postgres ($i/60)..."
            sleep 3
          done

      - name: Alembic-Migrations
        run: |
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml \
            exec -T backend-v2 alembic upgrade head

      - name: Bootstrap CI-Tenant
        env:
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          # Postgres-Container Port nach aussen freigeben temporaer? Nein —
          # wir nutzen exec im Container fuer das Bootstrap-Script.
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml \
            exec -T postgres-ci psql -U autopilot -d content_autopilot_v2 \
            -c "INSERT INTO tenants (id, api_key, name, slug, agentur_id, created_at) VALUES (gen_random_uuid(), '${{ env.E2E_API_KEY }}', 'CI Test Tenant', 'ci-test-tenant', 'ci-test-agency', NOW()) ON CONFLICT (api_key) DO NOTHING;"

      - name: Bootstrap CI-Login-User (E2E Login-Flow, #90/D6)
        env:
          E2E_LOGIN_EMAIL: ${{ env.E2E_LOGIN_EMAIL }}
          E2E_LOGIN_PASSWORD: ${{ env.E2E_LOGIN_PASSWORD }}
        run: |
          # Passwort-Hash ist scrypt mit Python-generiertem Salt (services/auth.py::hash_password) —
          # kein reiner SQL-Insert möglich, daher Hash im Container erzeugen und einbetten.
          #
          # user_tenant-Zeile ist PFLICHT (Nähte-Fund 2026-08-21): api/auth.py::_accessible_tenants
          # und services/auth.py::user_may_access_tenant lösen die Agentur-Zugehörigkeit eines
          # Tenants seit 2026-08-15 AUSSCHLIESSLICH über `user_tenant → users.agency_id` auf, nicht
          # mehr über tenants.agentur_id (dort steht nur der _meta-Default 'zb', kein Fremdschlüssel
          # auf agencies.slug). Ohne diese Zeile bleibt die Tenant-Liste selbst für role='owner' LEER
          # — der Login gelingt, aber die SPA zeigt "Kein Zugang eingerichtet" statt das Dashboard.
          HASH=$(docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml \
            exec -T backend-v2 python -c "from services.auth import hash_password; print(hash_password('${E2E_LOGIN_PASSWORD}'))" | tr -d '\r')
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml \
            exec -T postgres-ci psql -U autopilot -d content_autopilot_v2 \
            -c "INSERT INTO agencies (id, name, slug, created_at) VALUES (gen_random_uuid(), 'CI Test Agency', 'ci-test-agency', NOW()) ON CONFLICT (slug) DO NOTHING;"
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml \
            exec -T postgres-ci psql -U autopilot -d content_autopilot_v2 \
            -c "INSERT INTO users (id, email, agency_id, role, password_hash, is_active, created_at) SELECT gen_random_uuid(), '${E2E_LOGIN_EMAIL}', id, 'owner', '${HASH}', true, NOW() FROM agencies WHERE slug = 'ci-test-agency' ON CONFLICT (email) DO NOTHING;"
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml \
            exec -T postgres-ci psql -U autopilot -d content_autopilot_v2 \
            -c "INSERT INTO user_tenant (id, user_id, tenant_id, scope, created_at) SELECT gen_random_uuid(), u.id, t.id, 'agency', NOW() FROM users u, tenants t WHERE u.email = '${E2E_LOGIN_EMAIL}' AND t.api_key = '${{ env.E2E_API_KEY }}' ON CONFLICT (user_id, tenant_id) DO NOTHING;"

      - name: Wait for /api/health
        timeout-minutes: 3
        run: |
          for i in {1..40}; do
            if curl -sf "${E2E_BASE_URL}/api/health" >/dev/null 2>&1; then
              curl -s "${E2E_BASE_URL}/api/health" | python3 -m json.tool
              echo "Health OK."
              break
            fi
            echo "Warte auf /api/health ($i/40)..."
            sleep 3
          done
          curl -sf "${E2E_BASE_URL}/api/health" || (echo "Health-Check FAIL"; exit 1)

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers (Chromium only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Smoke Tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright Report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright Traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 14

      - name: Dump Backend Logs on failure
        if: failure()
        run: |
          echo "::group::Backend logs"
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml logs backend-v2 --tail=200 || true
          echo "::endgroup::"
          echo "::group::nginx logs"
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml logs nginx-v2 --tail=100 || true
          echo "::endgroup::"

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker-compose.v2.yml -f docker-compose.ci.yml down -v
