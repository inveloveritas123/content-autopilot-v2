name: Secret Scan (gitleaks)

# GitHub-native Secret-Scan. Ersetzt das (auf privaten Free-Repos nicht
# verfügbare) GitHub-Advanced-Security Secret Scanning.
# Nutzt die repo-eigene .gitleaks.toml (Allowlist für Beispiel-Tokens).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # volle Historie für --log-opts Scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
