name: Security Tests (Tenant Isolation)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/security-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/security-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  tenant-isolation:
    name: Tenant Isolation Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt -r requirements-test.txt

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Enable pgvector extension
        run: PGPASSWORD=test psql -h localhost -U test -d test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run database migrations
        run: PYTHONPATH=. alembic upgrade head
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          SYNC_DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          DEFAULT_TENANT_KEY: "test-key"

      - name: Run tenant isolation tests
        run: |
          python -m pytest tests/security/test_tenant_isolation.py \
            -v --tb=short -x
        env:
          PYTHONPATH: .
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          SYNC_DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          DEFAULT_TENANT_KEY: "test-key"

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Tenant-Isolation gebrochen!** Security tests failed — PR blocked.\n\nSiehe Workflow-Logs fuer Details.',
            });
