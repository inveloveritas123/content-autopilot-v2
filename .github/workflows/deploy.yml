name: Deploy (Server B)

# Deployt main auf Server B (/opt/content-autopilot-v2), NACHDEM die bestehende
# CI gruen ist. Trigger: workflow_run der beiden Pflicht-Workflows; ein Gate-Job
# verifiziert, dass BEIDE fuer denselben Commit erfolgreich waren.
#
# Constraints (CLAUDE.md): nur Ports 8601/8180, keine Firewall-/systemd-/
# Postgres-Aenderungen, v1 unter /opt/zukunftsbund-content-autopilot/ tabu.
# Dieses Deploy beruehrt ausschliesslich /opt/content-autopilot-v2.
#
# Runner: der DEPLOY-Job laeuft self-hosted im incus-Container 'content-autopilot'
# (kolonie-incus) als User 'runner' — er hat direkten Zugriff auf
# /opt/content-autopilot-v2 und docker, deshalb sind keine SSH-Secrets noetig.
# Der GATE-Job laeuft dagegen GitHub-hosted; Begruendung am Job selbst.

on:
  workflow_run:
    # BEWUSST nur EIN ausloesender Workflow. Frueher standen hier beide
    # Pflicht-Workflows — dann feuerte dieses Event zweimal pro Commit, und da der
    # Gate unten inzwischen auf den jeweils anderen Workflow WARTET, haette das pro
    # Merge zwei identische Deploys ergeben. Lint wird nicht als Trigger gebraucht:
    # der Gate prueft es ohnehin. tests.yml laeuft bei jedem Push ohne Pfadfilter
    # (`push: branches: ["**"]`), ist als Trigger also zuverlaessig.
    workflows:
      - "Tests (pytest)"
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-server-b
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: CI-Gate (Tests + Lint gruen fuer diesen Commit?)
    # BEWUSST GitHub-hosted, NICHT [self-hosted, kolonie]. Der Gate macht
    # ausschliesslich `gh api`-Aufrufe — er braucht weder docker noch
    # /opt/content-autopilot-v2. Auf dem self-hosted Runner waere er dagegen
    # gefaehrlich: es gibt genau EINEN ('kolonie-incus'), der immer nur einen Job
    # gleichzeitig bearbeitet. Der Gate wartet unten bis zu 30 Minuten auf
    # lint.yml — und lint.yml braucht denselben Runner. Faellt der Gate-Job vor
    # den Lint-Jobs auf den Runner, blockiert er genau das, worauf er wartet:
    # Selbst-Deadlock, 30 Minuten eingefrorene CI, danach hart rot und kein
    # Deploy. Die Queue-Reihenfolge (Gate wird immer erst nach Abschluss von
    # tests.yml eingereiht) macht das unwahrscheinlich, aber nicht unmoeglich —
    # und die Entkopplung kostet nur diese Zeile.
    runs-on: ubuntu-latest
    # workflow_run: nur weitermachen, wenn der ausloesende Lauf selbst gruen war
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      # Dieser Schritt SCHEITERT, wenn nicht deployt werden darf — er setzt kein
      # "ready=false" mehr. Grund: frueher haengte der Deploy-Job an
      # `if: needs.gate.outputs.ready == 'true'`, und ein nicht erfuellter `if:` ist
      # in GitHub Actions kein Fehler, sondern ein Nicht-Ereignis. Der Deploy-Job
      # wurde uebersprungen, der Workflow schloss trotzdem `success` ab, und
      # `gh run watch --exit-status` lieferte Exit-Code 0. "Nicht deployt" war von
      # "deployt" nach aussen nicht unterscheidbar (real passiert am 2026-07-31,
      # Run 30610741029: Lint war beim Trigger noch in der Queue).
      #
      # Zweite Aenderung: warten statt sofort urteilen. Beide Pflicht-Workflows
      # starten gleichzeitig; welcher zuerst fertig wird, ist Zufall.
      - name: Beide Pflicht-Workflows abwarten und pruefen
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          # SHA gegen das Commit-Format pruefen, bevor er als checkout-`ref` dient.
          if ! printf '%s' "${SHA}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Unerwartetes SHA-Format: '${SHA}' — abgebrochen."
            exit 1
          fi

          deadline=$(( SECONDS + 1800 ))   # 30 Minuten
          for wf in tests.yml lint.yml; do
            while :; do
              conclusion=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?head_sha=${SHA}&status=completed&per_page=1" \
                --jq '.workflow_runs[0].conclusion // "pending"')
              [ "${conclusion}" != "pending" ] && break
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "::error::${wf} hat fuer ${SHA} nach 30 Minuten keinen Abschluss — es wird NICHT deployt."
                exit 1
              fi
              echo "${wf}: laeuft noch, erneute Pruefung in 20s ..."
              sleep 20
            done
            echo "${wf}: ${conclusion}"
            if [ "${conclusion}" != "success" ]; then
              echo "::error::${wf} ist '${conclusion}' fuer ${SHA} — es wird NICHT deployt."
              exit 1
            fi
          done

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy auf Server B
    # KEIN `if:` mehr — der Gate scheitert hart, wenn nicht deployt werden darf.
    # Damit faerbt ein ausbleibender Deploy den Workflow rot, statt ihn stumm
    # gruen zu lassen.
    needs: gate
    runs-on: [self-hosted, kolonie]
    timeout-minutes: 30
    environment: production
    steps:
      # Auf genau den Commit gepinnt, den der Gate geprueft hat. Ohne `ref:` nimmt
      # actions/checkout bei workflow_run den Kopf des Default-Branches — dann
      # koennte ein anderer Commit ausgeliefert werden als der verifizierte.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Code nach /opt/content-autopilot-v2 syncen
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git' \
            --exclude='/.env' \
            --exclude='/frontend/node_modules' \
            --exclude='/frontend/dist' \
            --exclude='/data' \
            "$GITHUB_WORKSPACE/" /opt/content-autopilot-v2/

      - name: Frontend bauen
        run: |
          set -euo pipefail
          cd /opt/content-autopilot-v2/frontend
          npm ci
          npm run build

      - name: Docker-Images bauen
        run: |
          set -euo pipefail
          cd /opt/content-autopilot-v2
          docker compose -f docker-compose.v2.yml build \
            backend-v2 celery-worker-v2 celery-beat-v2 nginx-v2

      - name: DB-Migrationen anwenden (alembic upgrade head)
        run: |
          set -euo pipefail
          cd /opt/content-autopilot-v2
          docker compose -f docker-compose.v2.yml run --rm backend-v2 \
            alembic upgrade head

      - name: Container deployen
        run: |
          set -euo pipefail
          cd /opt/content-autopilot-v2
          docker compose -f docker-compose.v2.yml up -d --force-recreate \
            backend-v2 celery-worker-v2 celery-beat-v2 nginx-v2
          docker compose -f docker-compose.v2.yml restart nginx-v2

      - name: Health-Check
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8601/api/health > /dev/null; then
              echo "Health OK (Versuch ${i})"
              exit 0
            fi
            sleep 5
          done
          echo "Health-Check fehlgeschlagen — letzte Backend-Logs:" >&2
          cd /opt/content-autopilot-v2 && docker compose -f docker-compose.v2.yml logs \
            backend-v2 --tail 50 >&2
          exit 1
