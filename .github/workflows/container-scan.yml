name: Trivy Security Scan

on:
  push:
    paths:
      - "**/Dockerfile*"
      - "**/requirements.txt"
      - "**/package*.json"
      - "docker-compose*.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/Dockerfile*"
      - "**/requirements.txt"
      - "**/package*.json"
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  trivy-fs-scan:
    name: Filesystem & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (SARIF)
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          vuln-type: library
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Run Trivy config scan (Dockerfile misconfigs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
        continue-on-error: true

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.json
          exit-code: 0
        continue-on-error: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 30

      - name: Check for CRITICAL CVEs
        id: check-critical
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src" aquasec/trivy:latest fs --format json \
            --severity CRITICAL --ignore-unfixed --vuln-type library /src \
            > trivy-critical.json 2>/dev/null || true
          CRITICAL_COUNT=$(python3 -c "
          import json
          try:
              data = json.load(open('trivy-critical.json'))
              count = sum(len(r.get('Vulnerabilities') or []) for r in data.get('Results', []))
              print(count)
          except Exception:
              print(0)
          ")
          echo "critical_count=$CRITICAL_COUNT" >> "$GITHUB_OUTPUT"
          echo "CRITICAL CVEs found: $CRITICAL_COUNT"
        continue-on-error: true

      - name: Auto-create nightly issue if CRITICAL CVEs found
        if: >
          github.event_name == 'schedule' &&
          steps.check-critical.outputs.critical_count != '0' &&
          steps.check-critical.outputs.critical_count != ''
        uses: actions/github-script@v7
        with:
          script: |
            const count = '${{ steps.check-critical.outputs.critical_count }}';
            const sha = '${{ github.sha }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Trivy Nightly-Scan hat **${count} CRITICAL CVE(s)** in Dependencies gefunden.`,
              ``,
              `Branch: \`main\``,
              `Commit: \`${sha}\``,
              `Workflow-Run: ${runUrl}`,
              ``,
              `SBOM als Artefakt im Workflow-Run downloadbar.`,
              ``,
              `**Massnahmen:**`,
              `1. \`pip-audit\` oder \`npm audit\` lokal ausfuehren`,
              `2. Betroffene Packages updaten`,
              `3. Trivy erneut ausfuehren`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[SEC] Trivy: CRITICAL CVEs in Dependencies (${sha.substring(0,7)})`,
              body: body,
              labels: ['security'],
            });

      - name: Fail PR on CRITICAL CVEs
        if: >
          github.event_name == 'pull_request' &&
          steps.check-critical.outputs.critical_count != '0' &&
          steps.check-critical.outputs.critical_count != ''
        run: |
          echo "::error::${{ steps.check-critical.outputs.critical_count }} CRITICAL CVE(s) found — PR blocked. Siehe Trivy-Scan-Output."
          exit 1
