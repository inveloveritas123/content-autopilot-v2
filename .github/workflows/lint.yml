name: Lint (ruff + eslint + prettier)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-ruff:
    name: Backend — Ruff (lint + format)
    runs-on: [self-hosted, kolonie]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        run: |
          python3 -m venv .ci-lint-venv
          .ci-lint-venv/bin/pip install -q ruff==0.7.4

      - name: Ruff check
        run: .ci-lint-venv/bin/ruff check . --output-format=github

      - name: Ruff format (--check)
        run: .ci-lint-venv/bin/ruff format --check .

  frontend-eslint:
    name: Frontend — ESLint + Prettier
    runs-on: [self-hosted, kolonie]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  backend-rls-context-gate:
    name: Backend — G-RLS-KONTEXT (RLS-Blindstellen-Gate)
    runs-on: [self-hosted, kolonie]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: RLS-Kontext-Gate (statisch, keine Abhaengigkeiten)
        run: python3 scripts/check_rls_context_gate.py

  yaml-json-hygiene:
    name: YAML/JSON Hygiene + Secrets-Detection
    runs-on: [self-hosted, kolonie]
    steps:
      - uses: actions/checkout@v4

      - name: Install pre-commit
        run: |
          python3 -m venv .ci-hygiene-venv
          .ci-hygiene-venv/bin/pip install -q pre-commit==4.0.1

      - name: Run hygiene hooks
        # Nur die filesystem-orientierten Hooks — Ruff/ESLint/Prettier/gitleaks laufen
        # in eigenen Jobs. pre-commit akzeptiert keine Mehrfach-Hook-Argumente in einem
        # Aufruf, daher pro Hook einzeln.
        run: |
          for hook in trailing-whitespace end-of-file-fixer check-yaml check-json \
                      check-added-large-files check-merge-conflict detect-private-key; do
            .ci-hygiene-venv/bin/pre-commit run "$hook" --all-files || exit 1
          done
