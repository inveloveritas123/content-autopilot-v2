name: Lint (ruff + eslint + prettier)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-ruff:
    name: Backend — Ruff (lint + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.7.4

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Ruff format (--check)
        run: ruff format --check .

  frontend-eslint:
    name: Frontend — ESLint + Prettier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  yaml-json-hygiene:
    name: YAML/JSON Hygiene + Secrets-Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (fuer pre-commit)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit==4.0.1

      - name: Run hygiene hooks
        # Nur die filesystem-orientierten Hooks — Ruff/ESLint/Prettier/gitleaks laufen
        # in eigenen Jobs. pre-commit akzeptiert keine Mehrfach-Hook-Argumente in einem
        # Aufruf, daher pro Hook einzeln.
        run: |
          for hook in trailing-whitespace end-of-file-fixer check-yaml check-json \
                      check-added-large-files check-merge-conflict detect-private-key; do
            pre-commit run "$hook" --all-files || exit 1
          done
