# Rate-limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=webhook:5m rate=30r/s;

upstream backend_v2 {
    server backend-v2:8000;
}

server {
    listen 8080;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Health-Check fuer Container-Orchestrator
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Telegram Webhook — nur aus Telegram-Subnets erreichbar
    # Offizielle Telegram-IP-Ranges: https://core.telegram.org/bots/webhooks
    location /api/telegram/webhook {
        # Telegram-IP-Allowlist (Subnets koennen sich aendern — regelmaessig pruefen)
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        # Loopback fuer lokale Health-/Smoke-Tests
        allow 127.0.0.1;
        deny all;

        limit_req zone=webhook burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_v2/api/telegram/webhook;
        proxy_set_header Host $host;
        # X-Real-IP = echter Client-IP (nginx setzt dies zuverlässig)
        proxy_set_header X-Real-IP $remote_addr;
        # XFF explizit auf $remote_addr setzen (NICHT $proxy_add_x_forwarded_for)
        # um XFF-Spoofing-Bypass des App-Layer-Rate-Limiters zu verhindern
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    # Frontend
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API — rate-limited
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 503;

        proxy_pass http://backend_v2/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # XFF auf $remote_addr setzen (nicht anhängen) — verhindert Header-Spoofing
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
