- id: generic_008
  text: |
    Das Buch, das mein Fuehrungs-Verstehen am staerksten veraendert hat:
    "Turn the Ship Around" von David Marquet.

    Kernidee: Fuehren heisst nicht, Antworten zu geben. Es heisst, Fragen zu stellen,
    die andere dazu bringen, selbst die Antworten zu finden.

    Ein Kapitaen auf einem U-Boot hat gelernt, statt "Mach X" zu sagen:
    "Ich beabsichtige X zu tun." Damit verschob sich die Verantwortung zurueck ans Team.

    Diese eine Satz-Umformulierung hat meine 1:1s veraendert. Seitdem höre ich mehr,
    als ich rede.

    Welches Buch hat euch fachlich am staerksten beeinflusst?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Buchempfehlung mit Anwendungsbeispiel."

