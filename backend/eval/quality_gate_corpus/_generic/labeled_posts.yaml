# Quality-Gate Eval Korpus — Branche: _generic
# Skelett 2026-05-05 — Robert/Louis: bitte auf 50 Posts erweitern.
# _generic gilt fuer Posts ohne spezifische Branchenregeln.
# label: "good" | "bad"
# ground_truth_violations: Liste erwarteter Violations (leer wenn good)

- id: generic_001
  text: |
    Was ich heute in einem Meeting gelernt habe, das 30 Minuten Vorbereitung gebraucht haette
    und stattdessen 90 Minuten gedauert hat:

    Eine klare Agenda vor dem Meeting spart im Schnitt 40% der Meetingzeit (Harvard Business Review).
    Das sind bei 10 Teilnehmern 10 Personenstunden pro Meeting.

    Meine Regel: Kein Meeting ohne 3 klar formulierte Ziele im Kalendertermin.
    Nicht "Status besprechen" — sondern "Entscheidung X treffen bis Ende des Meetings".

    Was ist eure beste Meeting-Hygiene-Regel?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Universell anwendbarer Business-Tip."

