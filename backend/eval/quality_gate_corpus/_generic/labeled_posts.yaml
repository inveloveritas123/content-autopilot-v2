- id: generic_005
  text: |
    Remote Work nach 5 Jahren — was ich wirklich gelernt habe:

    Die Produktivitaet steigt nicht automatisch. Sie steigt, wenn man lernt,
    Grenzen zu setzen — nach aussen (Kunden, Kollegen) und nach innen (Ablenkungen).

    Was tatsaechlich hilft:
    - Feste Arbeitszeiten, auch wenn niemand zuschaut
    - Separater Arbeitsbereich, auch wenn es nur ein Tisch ist
    - Ende des Arbeitstages ritualisieren — Laptop zuklappen und rausgehen

    Was sich nie veraendert hat: Die besten Ideen kommen immer noch im Gespraech.
    Nicht im Solo-Deep-Work. Deshalb: bewusst mehr Video-Calls als noetig.

    Was ist euer groesster Remote-Work-Tipp?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Persoenliche Erfahrung, konkrete Tipps."

- id: generic_006
  text: |
    Warum ich aufgehoert habe, auf LinkedIn zu posten — und warum ich wieder angefangen habe:

    Aufgehort: Weil ich dachte, niemand liest das wirklich. Likes sind kein Beweis.

    Wieder angefangen: Weil mir drei Menschen in einem Jahr gesagt haben,
    ein spezifischer Post hat ihnen geholfen. Drei Menschen sind echte Menschen.

    Reichweite ist nicht das Ziel. Wirkung ist das Ziel. Auch wenn sie klein ist.

    Was war der Post, den du geschrieben hast und der unerwartet Wirkung hatte?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Meta-LinkedIn-Content, authentisch."

