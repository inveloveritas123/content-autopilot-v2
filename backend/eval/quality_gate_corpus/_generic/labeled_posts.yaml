- id: generic_003
  text: |
    5 Fragen, die ich jedem neuen Mitarbeiter in der ersten Woche stelle:

    1. Was hat euch an eurem letzten Job am meisten genervt?
    2. Was haettet ihr gerne frueher gewusst?
    3. Was wurde euch versprochen, das nicht gehalten wurde?
    4. Womit koennt ihr am meisten beitragen, aber noch keine Chance hattet?
    5. Was braucht ihr von mir, damit ihr euren besten Job macht?

    Diese Antworten sind Gold. Sie zeigen, wo echte Probleme liegen —
    nicht die Probleme, ueber die Fuehrungskraefte reden, sondern die, die wirklich zaehlen.

    Welche Frage fehlt in eurer Meinung auf dieser Liste?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Leadership-Content, starke CTA."

