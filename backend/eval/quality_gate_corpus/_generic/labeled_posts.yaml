- id: generic_010
  text: |
    Das Konzept, das meinen Kalender transformiert hat: Energy-Management statt Time-Management.

    Zeit ist endlich — das wissen wir. Energie ist erneuerbar — das vergessen wir.

    Ich habe gelernt, meine Deep-Work-Stunden in die Zeiten zu legen, in denen
    ich die hoechste kognitive Leistung habe (bei mir: 8–11 Uhr). Administrative
    Aufgaben kommen danach. Meetings am fruehen Nachmittag, wenn die Energie sowieso sinkt.

    Ergebnis nach 6 Monaten: Gleiche Stunden, mehr Output, weniger Erschoepfung.

    Wann seid ihr am produktivsten — und nutzt ihr das systematisch?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Produktivitaets-Framework, persoenliche Daten."
