- id: recht_010
  text: |
    Der Unterschied zwischen einem guten und einem sehr guten Anwalt:

    Ein guter Anwalt kennt das Gesetz.
    Ein sehr guter Anwalt versteht, was der Mandant wirklich braucht.

    Ich habe Faelle abgelehnt, die ich haette gewinnen koennen — weil der Aufwand
    in keinem Verhaeltnis zum Ergebnis fuer den Mandanten gestanden haette.

    Professionalitaet bedeutet manchmal, Nein zu sagen.

    Keine Rechtsberatung — nur eine persoenliche Reflexion nach 15 Jahren Kanzleiarbeit.

    Wie seht ihr das in eurem Berufsfeld?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Reflexion, Erfahrungswert, Disclaimer."
