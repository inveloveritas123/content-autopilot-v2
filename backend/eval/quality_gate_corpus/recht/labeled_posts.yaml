- id: recht_003
  text: |
    5 Klauseln, die in jedem Mietvertrag illegal sind — und trotzdem hauffig vorkommen:

    1. Schoenheitsreparaturen alle 3 Jahre unabhaengig vom Zustand (BGH untersagt)
    2. Verbot von Haustieren generell (nur Einzelfallentscheid erlaubt)
    3. Pflicht zur Renovierung beim Auszug ohne Ruecksicht auf Vorschaeden
    4. Kuendigung mit weniger als 3 Monaten Frist fuer Mieter
    5. Kautionszinsen nicht an Mieter auszuzahlen

    Kein Rechtsberatung — diese Information dient nur zur ersten Orientierung.
    Im Streitfall immer einen Fachanwalt fuer Mietrecht hinzuziehen.

    Welche Klausel habt ihr schon erlebt?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Listenformat, Disclaimer vorhanden."

- id: recht_004
  text: |
    Datenschutz im Unternehmen: Was viele KMU uebersehen.

    Seit DSGVO 2018 sind Bussgelder bis 4% des Jahresumsatzes moeglich.
    Dennoch haben laut Bitkom 2024 fast 40% der deutschen KMU keine vollstaendige
    Datenschutzerklaerung auf ihrer Website.

    Die drei haeufigsten Luecken:
    - Kein Auftragsverarbeitungsvertrag mit Cloud-Anbietern
    - Newsletter ohne Double-Opt-In
    - Kontaktformulare ohne Einwilligung

    Dies ist kein Rechtsberatung. Fuer eine individuelle DSGVO-Pruefung empfehle ich
    einen zertifizierten Datenschutzbeauftragten.

    Was habt ihr in eurem Unternehmen als groesste DSGVO-Luecke entdeckt?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Daten, Kontext, Disclaimer."

