- id: recht_001
  text: |
    Aufhebungsvertrag vs. Kuendigung — was viele Arbeitnehmer falsch verstehen:

    Wer einen Aufhebungsvertrag unterschreibt, riskiert eine Sperrzeit beim Arbeitslosengeld.
    Das sind 12 Wochen ohne ALG1 — selbst wenn der Arbeitgeber zur Kuendigung gedraengt hat.

    Mein Rat: Niemals unter Druck unterschreiben. Immer mindestens 24 Stunden Bedenkzeit fordern.
    Das Recht dazu haben Sie — und kein Arbeitgeber kann Sie zwingen.

    Diese Information stellt keine Rechtsberatung dar. Im Einzelfall immer einen Anwalt konsultieren.

    Habt ihr Erfahrungen mit solchen Situationen gemacht?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Guter Rechts-Post mit korrektem Disclaimer."

