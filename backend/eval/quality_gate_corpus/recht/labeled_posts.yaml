- id: recht_006
  text: |
    Warum ich meinen Mandanten oft rate, NICHT zu klagen:

    Prozesskosten, Zeitaufwand, emotionale Belastung — das sind reale Kosten,
    die in keiner Kostenrechnung auftauchen.

    Ein Vergleich, der 70% des Streitwerts bringt, ist oft wirtschaftlich besser
    als ein gewonnenes Urteil nach 3 Jahren.

    Das ist keine juristische Weisheit, die Anwaelte gerne teilen. Aber es ist die Wahrheit.

    Dieser Post stellt keine Rechtsberatung dar. Jeder Fall ist individuell.

    Was denkt ihr — Klage oder Vergleich?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Kontraintuitive Perspektive, Disclaimer."

