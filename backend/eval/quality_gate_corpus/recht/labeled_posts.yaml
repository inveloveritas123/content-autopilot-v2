- id: recht_008
  text: |
    GmbH oder GmbH & Co. KG — die Wahl der Rechtsform entscheidet ueber Haftung und Steuern.

    GmbH: Haftungsbeschraenkung auf Stammkapital (mind. 25.000 EUR), Koerperschaftsteuer 15%,
    aber Geschaeftsfuehrergehalt sozialversicherungspflichtig.

    GmbH & Co. KG: Kombination aus KG-Flexibilitaet und GmbH-Haftungsschutz, Steuergestaltung
    durch Sonderbetriebsvermoegen moeglich, aber komplexere Buchfuehrung.

    Fuer Einzelperson-Unternehmen mit >100k EUR Gewinn: GmbH oft vorteilhaft.
    Fuer Familienbetriebe mit Nachfolgeplanung: GmbH & Co. KG haeufig besser.

    Dies ist eine allgemeine Information, keine Rechtsberatung. Steuerberater und Anwalt
    hinzuziehen vor jeder Gruendungsentscheidung.

    Welche Rechtsform habt ihr gewaehlt und warum?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Fachliche Tiefe, Disclaimer, CTA."

