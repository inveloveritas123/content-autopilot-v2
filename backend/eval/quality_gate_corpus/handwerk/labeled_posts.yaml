- id: handwerk_006
  text: |
    Was unterscheidet einen guten Handwerker von einem sehr guten?
    Nicht das Werkzeug. Nicht mal die Erfahrung allein.

    Es ist die Kommunikation.

    Ich habe letztes Jahr 40 Auftraege abgelehnt — nicht weil ich ausgebucht war,
    sondern weil die Beschreibung des Problems so vage war, dass ich kein fairen Preis
    haette nennen koennen. Das waere unfair dem Kunden gegenueber.

    Klare Kommunikation vor dem Auftrag = weniger Missverstaendnisse, bessere Ergebnisse,
    zufriedenere Kunden.

    Wie handhabt ihr das in eurem Betrieb?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Persoenliche Reflexion, gute Struktur."

