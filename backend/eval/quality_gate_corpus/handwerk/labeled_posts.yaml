- id: handwerk_004
  text: |
    Drei Fehler, die ich in 20 Jahren als Elektriker immer wieder sehe:

    1. Selbst installierte Steckdosen ohne Erdung — ein Brandrisiko.
    2. Verlängerungskabel als Dauerlösung — gefährlich und teuer.
    3. Sicherungen überbrückt statt ausgetauscht — lebensgefährlich.

    Als Laie ist es schwer, diese Fehler zu erkennen. Deshalb: Elektroinstallation alle 10 Jahre
    prüfen lassen. Der TÜV empfiehlt es, die Versicherung fordert es.

    Was würdet ihr noch ergänzen?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Listenformat, Mehrwert, CTA."

