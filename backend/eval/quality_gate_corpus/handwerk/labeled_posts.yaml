- id: handwerk_009
  text: |
    Fruehjahrs-Tipp fuer Hausbesitzer: Bevor die Hitze kommt, Dachventilation pruefen.

    Ein schlecht belueftetes Dach kann im Sommer bis zu 70°C erreichen. Das beschleunigt
    die Alterung der Dachpappe um das Dreifache. Im Winter bildet sich Kondenswasser —
    Schimmelgefahr inklusive.

    Loesung: Dachventilator oder Firstentlueftung. Kosten: 150–400 Euro fuer ein Einfamilienhaus.
    Einsparpotenzial langfristig: bis zu 5.000 Euro weniger Sanierungskosten.

    Wer hat schon sein Dach gecheckt? Oder wollt ihr einen Profi beaufragen?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Saisonaler Tipp, konkrete Zahlen."

