- id: finanzen_008
  text: |
    Warum Finanzbildung ein soziales Thema ist:

    Wer reich aufgewachsen ist, lernt frueh: Geld investieren, nicht nur sparen.
    Wer aermeren Verhaeltnissen entstammt, lernt oft: Geld ist knapp, bloß nicht verlieren.

    Dieses Mindset erklaert zu einem grossen Teil, warum Vermoegen in Deutschland so ungleich
    verteilt ist (Top 10% besitzen ~66% des Nettovermoegen, Bundesbank 2023).

    Finanzbildung in Schulen ist keine nette Idee — sie ist eine Gerechtigkeitsfrage.

    Keine Anlageberatung, sondern eine gesellschaftliche Beobachtung.

    Was denkt ihr: Sollte Finanzbildung Pflichtfach sein?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Gesellschaftliche Dimension, Daten, Disclaimer."

