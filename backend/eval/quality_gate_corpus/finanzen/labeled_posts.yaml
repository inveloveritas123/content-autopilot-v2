- id: finanzen_005
  text: |
    Notgroschen — die unterschaetzte Basis jeder Finanzplanung:

    Vor ETF, vor Aktien, vor allem anderen: 3–6 Monatsgehaelter liquide auf einem
    Tagesgeldkonto. Das ist kein Luxus, das ist Pflichtprogramm.

    Warum? Wer keinen Notgroschen hat, verkauft Aktien im Crash — genau dann,
    wenn man kaufen sollte. Der Notgroschen ist die psychologische Absicherung.

    Aktuell bieten einige Banken noch 3,5% auf Tagesgeld. Das schlaegt die Inflation
    fast aus — und bleibt jederzeit verfuegbar.

    Dies ist keine Anlageberatung. Jede Finanzsituation ist individuell.

    Habt ihr euren Notgroschen aufgebaut?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Praxistipp, Psychologie, Disclaimer."

- id: finanzen_006
  text: |
    3 Steuer-Tricks fuer Selbstaendige, die kaum jemand kennt:

    1. Arbeitszimmer: Bis zu 1.250 EUR/Jahr pauschal absetzbar — auch ohne separaten Raum.
    2. Betriebliche Altersvorsorge: Bis zu 604 EUR/Monat steuerfrei einzahlen.
    3. Investitionsabzugsbetrag (IAB): 50% geplanter Investitionen schon im Vorjahr abziehen.

    Allein IAB kann die Steuerlast im Spit zenjahr um mehrere Tausend Euro senken.

    Keine Steuerberatung — fuer individuelle Optimierung immer einen Steuerberater hinzuziehen.
    Keine Anlageberatung.

    Welchen Trick habt ihr schon genutzt?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Konkrete Steuertipps, doppelter Disclaimer."

