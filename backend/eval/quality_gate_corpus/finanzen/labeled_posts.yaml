- id: finanzen_001
  text: |
    Der groesste Fehler bei der Altersvorsorge: zu spaet anfangen.

    Wer mit 25 monatlich 200 EUR bei 6% Rendite anlegt, hat mit 65 rund 400.000 EUR.
    Wer mit 35 startet, hat mit 65 nur noch ~200.000 EUR — trotz gleicher monatlicher Einzahlung.

    Der Zinseszins-Effekt ist keine Magie. Es ist Mathematik. Und Zeit ist die Variable,
    die kein Geld kaufen kann.

    Dies ist keine Anlageberatung. Individuelle Beratung beim Finanzberater oder Honorarberater.

    Habt ihr frueh angefangen oder wartet ihr noch?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Zinseszins-Visualisierung, Disclaimer."

