- id: finanzen_003
  text: |
    ETF vs. aktiv gemanagte Fonds — die Zahlen sprechen eine klare Sprache:

    Laut SPIVA-Studie 2023 schlagen 85% der aktiven Fondsmanager ihren Benchmark-Index
    ueber 15 Jahre NICHT. Die Kostenquote (TER) ist dabei der entscheidende Faktor:
    aktive Fonds kosten 1,5–2,5%, ETFs oft unter 0,2%.

    Das bedeutet: Ein Vorteil von 1,5% pro Jahr klingt klein. Ueber 30 Jahre macht
    das bei 100.000 EUR Anlagesumme einen Unterschied von ueber 100.000 EUR.

    Keine Anlageberatung — allgemeine Finanzbildung. Eigene Situation immer mit
    zugelassenem Berater besprechen.

    Was nutzt ihr — ETF oder aktive Fonds?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Datenbasiert, Disclaimer, CTA."

