- id: finanzen_010
  text: |
    Der psychologische Fehler, der die meisten Anleger Geld kostet:

    Verlust-Aversion. Wir empfinden einen Verlust von 1.000 EUR doppelt so stark
    wie einen gleich grossen Gewinn. Das ist evolutionaer sinnvoll — fuer Investoren fatal.

    Konsequenz: Wir halten Verlustpositionen zu lang (Hoffnung auf Erholung) und
    verkaufen Gewinner zu frueh (Angst vor Kursrueckgang). Beides kostet Rendite.

    Die Loesung: Regelbasiertes Investieren. Stop-Loss-Levels vorher festlegen,
    nicht im Moment der Emotion entscheiden.

    Keine Anlageberatung — Behavioural Finance ist ein akademisches Feld,
    das fuer jeden Investor relevant ist.

    Welchen psychologischen Fehler habt ihr bei euch beobachtet?
  label: "good"
  ground_truth_violations: []
  notes: "Initial-Skelett 2026-05-05. Behavioral Finance, Disclaimer, CTA."
