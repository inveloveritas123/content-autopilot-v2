apiVersion: v1
kind: Service
metadata:
  name: {{ include "content-autopilot.fullname" . }}-redis
  labels:
    {{- include "content-autopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    {{- include "content-autopilot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: 6379
      protocol: TCP
