apiVersion: v1
kind: Service
metadata:
  name: {{ include "content-autopilot.fullname" . }}-postgresql
  labels:
    {{- include "content-autopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  selector:
    {{- include "content-autopilot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.service.port }}
      targetPort: 5432
      protocol: TCP
