apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "content-autopilot.fullname" . }}-backend
  labels:
    {{- include "content-autopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "content-autopilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "content-autopilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: {{ include "content-autopilot.backendImage" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "content-autopilot.fullname" . }}-config
            - secretRef:
                name: {{ include "content-autopilot.fullname" . }}-secrets
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "content-autopilot.fullname" . }}-secrets
                  key: db-password
            - name: DEFAULT_TENANT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "content-autopilot.fullname" . }}-secrets
                  key: default-tenant-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "content-autopilot.fullname" . }}-secrets
                  key: anthropic-api-key
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "content-autopilot.fullname" . }}-secrets
                  key: gemini-api-key
            - name: LITELLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "content-autopilot.fullname" . }}-secrets
                  key: litellm-base-url
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "content-autopilot.fullname" . }}-secrets
                  key: litellm-api-key
            - name: REQUESTY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "content-autopilot.fullname" . }}-secrets
                  key: requesty-api-key
            - name: NEXTCLOUD_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "content-autopilot.fullname" . }}-secrets
                  key: nextcloud-url
            - name: NEXTCLOUD_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "content-autopilot.fullname" . }}-secrets
                  key: nextcloud-user
            - name: NEXTCLOUD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "content-autopilot.fullname" . }}-secrets
                  key: nextcloud-password
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "content-autopilot.fullname" . }}-secrets
                  key: sentry-dsn
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
