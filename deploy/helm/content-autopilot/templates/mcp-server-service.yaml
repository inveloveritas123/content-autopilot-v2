apiVersion: v1
kind: Service
metadata:
  name: {{ include "content-autopilot.fullname" . }}-mcp-server
  labels:
    {{- include "content-autopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  type: {{ .Values.mcpServer.service.type }}
  selector:
    {{- include "content-autopilot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
  ports:
    - name: http
      port: {{ .Values.mcpServer.service.port }}
      targetPort: 8080
      protocol: TCP
