apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "content-autopilot.fullname" . }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "content-autopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "content-autopilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: {{ include "content-autopilot.backendImage" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "content-autopilot.fullname" . }}-config
            - secretRef:
                name: {{ include "content-autopilot.fullname" . }}-secrets
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "content-autopilot.fullname" . }}-secrets
                  key: db-password
