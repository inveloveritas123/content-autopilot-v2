{{- if .Values.secrets.dbPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "content-autopilot.fullname" . }}-secrets
  labels:
    {{- include "content-autopilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ .Values.secrets.dbPassword | quote }}
  default-tenant-key: {{ .Values.secrets.defaultTenantKey | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey | quote }}
  litellm-base-url: {{ .Values.secrets.litellmBaseUrl | quote }}
  litellm-api-key: {{ .Values.secrets.litellmApiKey | quote }}
  requesty-api-key: {{ .Values.secrets.requestyApiKey | quote }}
  nextcloud-url: {{ .Values.secrets.nextcloudUrl | quote }}
  nextcloud-user: {{ .Values.secrets.nextcloudUser | quote }}
  nextcloud-password: {{ .Values.secrets.nextcloudPassword | quote }}
  admin-token: {{ .Values.secrets.adminToken | quote }}
  sentry-dsn: {{ .Values.secrets.sentryDsn | quote }}
  mcp-client-id: {{ .Values.secrets.mcpClientId | quote }}
  mcp-client-secret: {{ .Values.secrets.mcpClientSecret | quote }}
  mcp-bearer-token: {{ .Values.secrets.mcpBearerToken | quote }}
{{- end }}
