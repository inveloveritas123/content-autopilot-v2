services:
  redis-v2:
    image: redis:7-alpine
    command: redis-server --databases 4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - cap-v2-net

  backend-v2:
    build: ./backend
    # privileged required on this Proxmox LXC host — LXC user-namespace nesting
    # restricts AF_UNIX socketpair without it. read_only added for FS hardening.
    privileged: true
    security_opt:
      - label=disable
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      SYNC_DATABASE_URL: postgresql://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      REDIS_URL: redis://redis-v2:6379/1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      REQUESTY_API_KEY: ${REQUESTY_API_KEY:-}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD:-}
      DEFAULT_TENANT_KEY: ${DEFAULT_TENANT_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_ENV: ${APP_ENV:-production}
      UVICORN_LOOP: asyncio
    depends_on:
      redis-v2:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - cap-v2-net

  celery-worker-v2:
    build: ./backend
    privileged: true
    security_opt:
      - label=disable
    cap_drop:
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_RAWIO
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      - AUDIT_WRITE
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A tasks.celery_app worker -l info -c 2
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      SYNC_DATABASE_URL: postgresql://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      REDIS_URL: redis://redis-v2:6379/1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      REQUESTY_API_KEY: ${REQUESTY_API_KEY:-}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      redis-v2:
        condition: service_healthy
    networks:
      - cap-v2-net

  celery-beat-v2:
    build: ./backend
    privileged: true
    security_opt:
      - label=disable
    cap_drop:
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_RAWIO
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      - AUDIT_WRITE
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Store beat schedule in /tmp (writable tmpfs) instead of /app (read-only)
    command: celery -A tasks.celery_app beat -l info -s /tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      SYNC_DATABASE_URL: postgresql://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      REDIS_URL: redis://redis-v2:6379/1
    depends_on:
      redis-v2:
        condition: service_healthy
    networks:
      - cap-v2-net

  mcp-server-v2:
    build: ./mcp-server
    privileged: true
    security_opt:
      - label=disable
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_URL: http://backend-v2:8000
      API_KEY: ${DEFAULT_TENANT_KEY}
      MCP_PORT: "8080"
      MCP_CLIENT_ID: ${MCP_CLIENT_ID:-content-autopilot}
      MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET:-}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
    ports:
      - "${MCP_PORT:-8180}:8080"
    depends_on:
      - backend-v2
    networks:
      - cap-v2-net

  nginx-v2:
    build:
      context: .
      dockerfile: nginx/Dockerfile.v2
    privileged: true
    security_opt:
      - label=disable
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=755
      - /var/run:mode=755
      - /tmp:mode=1777
    ports:
      - "${APP_PORT:-8601}:8080"
    depends_on:
      - backend-v2
    networks:
      - cap-v2-net

networks:
  cap-v2-net:
    driver: bridge
