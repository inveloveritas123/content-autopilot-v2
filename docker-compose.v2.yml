services:
  redis-v2:
    image: redis:7-alpine
    command: redis-server --databases 4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - cap-v2-net

  backend-v2:
    image: ${REGISTRY:-10.10.0.1:3000}/meister/content-autopilot-v2/backend:${IMAGE_TAG:-main}
    build: ./backend
    # privileged required on this Proxmox LXC host — LXC user-namespace nesting
    # restricts AF_UNIX socketpair without it. read_only added for FS hardening.
    privileged: true
    security_opt:
      - label=disable
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      SYNC_DATABASE_URL: postgresql://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      REDIS_URL: redis://redis-v2:6379/1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      REQUESTY_API_KEY: ${REQUESTY_API_KEY:-}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD:-}
      DEFAULT_TENANT_KEY: ${DEFAULT_TENANT_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_ENV: ${APP_ENV:-production}
      BRAND_VOICE_NC_BASE_PATH: ${BRAND_VOICE_NC_BASE_PATH:-/content-autopilot/v2/Kunde/}
      PROMPT_NC_BASE_PATH: ${PROMPT_NC_BASE_PATH:-/zukunftsbund/projekte/content-autopilot/datensammlung/prompts-skills/}
      UVICORN_LOOP: asyncio
      COST_CAP_USD_PER_DAY: ${COST_CAP_USD_PER_DAY:-5.0}
      COST_CAP_USD_GLOBAL_PER_DAY: ${COST_CAP_USD_GLOBAL_PER_DAY:-10.0}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}  # Setzen für 50%-Cost-Cap-Alert via Telegram
    depends_on:
      redis-v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
    networks:
      - cap-v2-net

  celery-worker-v2:
    image: ${REGISTRY:-10.10.0.1:3000}/meister/content-autopilot-v2/backend:${IMAGE_TAG:-main}
    build: ./backend
    privileged: true
    security_opt:
      - label=disable
    cap_drop:
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_RAWIO
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      - AUDIT_WRITE
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A tasks.celery_app worker -l info -c 2
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      SYNC_DATABASE_URL: postgresql://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      REDIS_URL: redis://redis-v2:6379/1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      REQUESTY_API_KEY: ${REQUESTY_API_KEY:-}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_ENV: ${APP_ENV:-production}
      COST_CAP_USD_PER_DAY: ${COST_CAP_USD_PER_DAY:-5.0}
      COST_CAP_USD_GLOBAL_PER_DAY: ${COST_CAP_USD_GLOBAL_PER_DAY:-10.0}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}  # Setzen für 50%-Cost-Cap-Alert via Telegram
    depends_on:
      redis-v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - cap-v2-net

  celery-beat-v2:
    image: ${REGISTRY:-10.10.0.1:3000}/meister/content-autopilot-v2/backend:${IMAGE_TAG:-main}
    build: ./backend
    privileged: true
    security_opt:
      - label=disable
    cap_drop:
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_RAWIO
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      - AUDIT_WRITE
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Store beat schedule in /tmp (writable tmpfs) instead of /app (read-only)
    command: celery -A tasks.celery_app beat -l info -s /tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      SYNC_DATABASE_URL: postgresql://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      REDIS_URL: redis://redis-v2:6379/1
    depends_on:
      redis-v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule && cat /proc/1/cmdline | grep -q beat"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cap-v2-net

  mcp-server-v2:
    image: ${REGISTRY:-10.10.0.1:3000}/meister/content-autopilot-v2/mcp-server:${IMAGE_TAG:-main}
    build: ./mcp-server
    privileged: true
    security_opt:
      - label=disable
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_URL: http://backend-v2:8000
      API_KEY: ${DEFAULT_TENANT_KEY}
      MCP_PORT: "8080"
      MCP_CLIENT_ID: ${MCP_CLIENT_ID:-content-autopilot}
      MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET:-}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
    ports:
      - "${MCP_PORT:-8180}:8080"
    depends_on:
      - backend-v2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - cap-v2-net

  nginx-v2:
    image: ${REGISTRY:-10.10.0.1:3000}/meister/content-autopilot-v2/nginx:${IMAGE_TAG:-main}
    build:
      context: .
      dockerfile: nginx/Dockerfile.v2
    privileged: true
    security_opt:
      - label=disable
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=755
      - /var/run:mode=755
      - /tmp:mode=1777
    ports:
      - "${APP_PORT:-8601}:8080"
    depends_on:
      - backend-v2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cap-v2-net

networks:
  cap-v2-net:
    driver: bridge
