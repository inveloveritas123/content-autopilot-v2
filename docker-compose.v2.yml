services:
  redis-v2:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --databases 4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - cap-v2-net

  backend-v2:
    image: ${IMAGE_PREFIX:-content-autopilot-v2}/backend:${IMAGE_TAG:-local}
    build: ./backend
    restart: unless-stopped
    # privileged required on this Proxmox LXC host — LXC user-namespace nesting
    # restricts AF_UNIX socketpair without it. read_only added for FS hardening.
    privileged: true
    security_opt:
      - label=disable
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      SYNC_DATABASE_URL: postgresql://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      REDIS_URL: redis://redis-v2:6379/1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      REQUESTY_API_KEY: ${REQUESTY_API_KEY:-}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD:-}
      DEFAULT_TENANT_KEY: ${DEFAULT_TENANT_KEY}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      # Secure-Flag für Session-/CSRF-Cookies — fehlte hier komplett, .env-Wert wurde
      # nie an den Container durchgereicht (Docker Compose liest .env NICHT automatisch
      # in den Container, nur was hier explizit gemappt ist). Gefunden 2026-08-13 beim
      # Login-Guard-Deploy: COOKIE_SECURE=true in .env, Backend-Log zeigte trotzdem die
      # production-Warnung.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_ENV: ${APP_ENV:-production}
      BRAND_VOICE_NC_BASE_PATH: ${BRAND_VOICE_NC_BASE_PATH:-/content-autopilot/v2/Kunde/}
      PROMPT_NC_BASE_PATH: ${PROMPT_NC_BASE_PATH:-/zukunftsbund/projekte/content-autopilot/datensammlung/prompts-skills/}
      # Kanonische Prompt/Rule/Schema-Quelle (Repo-Verzeichnis content-truth/)
      CONTENT_TRUTH_BASE_PATH: ${CONTENT_TRUTH_BASE_PATH:-/app/content-truth}
      PROMPT_STORAGE_BACKEND: ${PROMPT_STORAGE_BACKEND:-localfs}
      # Beschreibbares Overlay fuer Prompt-Studio-Edits
      CONTENT_TRUTH_OVERLAY_PATH: ${CONTENT_TRUTH_OVERLAY_PATH:-/app/data/prompts-custom}
      UVICORN_LOOP: asyncio
      COST_CAP_USD_PER_DAY: ${COST_CAP_USD_PER_DAY:-5.0}
      COST_CAP_USD_GLOBAL_PER_DAY: ${COST_CAP_USD_GLOBAL_PER_DAY:-10.0}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}  # Setzen für 50%-Cost-Cap-Alert via Telegram
      PIPELINE_TIER_DEFAULT: ${PIPELINE_TIER_DEFAULT:-S1}
    depends_on:
      redis-v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
      - ./content-truth:/app/content-truth:ro
    networks:
      - cap-v2-net

  celery-worker-v2:
    image: ${IMAGE_PREFIX:-content-autopilot-v2}/backend:${IMAGE_TAG:-local}
    build: ./backend
    restart: unless-stopped
    privileged: true
    security_opt:
      - label=disable
    cap_drop:
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_RAWIO
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      - AUDIT_WRITE
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A tasks.celery_app worker -l info -c 2
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      SYNC_DATABASE_URL: postgresql://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      REDIS_URL: redis://redis-v2:6379/1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      REQUESTY_API_KEY: ${REQUESTY_API_KEY:-}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_ENV: ${APP_ENV:-production}
      DEFAULT_TENANT_KEY: ${DEFAULT_TENANT_KEY}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      COST_CAP_USD_PER_DAY: ${COST_CAP_USD_PER_DAY:-5.0}
      COST_CAP_USD_GLOBAL_PER_DAY: ${COST_CAP_USD_GLOBAL_PER_DAY:-10.0}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}  # Setzen für 50%-Cost-Cap-Alert via Telegram
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-false}
      PIPELINE_TIER_DEFAULT: ${PIPELINE_TIER_DEFAULT:-S1}
      # Kanonische Prompt/Rule/Schema-Quelle (Repo-Verzeichnis content-truth/)
      CONTENT_TRUTH_BASE_PATH: ${CONTENT_TRUTH_BASE_PATH:-/app/content-truth}
      PROMPT_STORAGE_BACKEND: ${PROMPT_STORAGE_BACKEND:-localfs}
      # Beschreibbares Overlay fuer Prompt-Studio-Edits (muss Worker sehen koennen!)
      CONTENT_TRUTH_OVERLAY_PATH: ${CONTENT_TRUTH_OVERLAY_PATH:-/app/data/prompts-custom}
    volumes:
      - ./data:/app/data
      - ./content-truth:/app/content-truth:ro
    depends_on:
      redis-v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - cap-v2-net

  celery-beat-v2:
    image: ${IMAGE_PREFIX:-content-autopilot-v2}/backend:${IMAGE_TAG:-local}
    build: ./backend
    restart: unless-stopped
    privileged: true
    security_opt:
      - label=disable
    cap_drop:
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_RAWIO
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      - AUDIT_WRITE
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Store beat schedule in /tmp (writable tmpfs) instead of /app (read-only)
    command: celery -A tasks.celery_app beat -l info -s /tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      SYNC_DATABASE_URL: postgresql://autopilot:${DB_PASSWORD}@host.docker.internal:5432/content_autopilot_v2
      REDIS_URL: redis://redis-v2:6379/1
      # Kanonische Prompt/Rule/Schema-Quelle (Repo-Verzeichnis content-truth/)
      CONTENT_TRUTH_BASE_PATH: ${CONTENT_TRUTH_BASE_PATH:-/app/content-truth}
      PROMPT_STORAGE_BACKEND: ${PROMPT_STORAGE_BACKEND:-localfs}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-false}
      # Beschreibbares Overlay fuer Prompt-Studio-Edits (muss Beat sehen koennen!)
      CONTENT_TRUTH_OVERLAY_PATH: ${CONTENT_TRUTH_OVERLAY_PATH:-/app/data/prompts-custom}
    volumes:
      - ./data:/app/data
      - ./content-truth:/app/content-truth:ro
    depends_on:
      redis-v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule && cat /proc/1/cmdline | grep -q beat"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cap-v2-net

  mcp-server-v2:
    image: ${IMAGE_PREFIX:-content-autopilot-v2}/mcp-server:${IMAGE_TAG:-local}
    build: ./mcp-server
    restart: unless-stopped
    privileged: true
    security_opt:
      - label=disable
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_URL: http://backend-v2:8000
      API_KEY: ${DEFAULT_TENANT_KEY}
      MCP_PORT: "8080"
      MCP_CLIENT_ID: ${MCP_CLIENT_ID:-content-autopilot}
      MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET:-}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
    ports:
      - "${MCP_PORT:-8180}:8080"
    depends_on:
      - backend-v2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - cap-v2-net

  nginx-v2:
    image: ${IMAGE_PREFIX:-content-autopilot-v2}/nginx:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: nginx/Dockerfile.v2
    restart: unless-stopped
    privileged: true
    security_opt:
      - label=disable
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=755
      - /var/run:mode=755
      - /tmp:mode=1777
    ports:
      - "${APP_PORT:-8601}:8080"
      - "8611:8082"
    depends_on:
      - backend-v2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cap-v2-net

  # ------------------------------------------------------------------
  # Nextcloud (optional, kann mit profile nextcloud aktiviert werden)
  # ------------------------------------------------------------------
  nextcloud-app:
    image: nextcloud:30-fpm-alpine
    profiles: ["nextcloud"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in .env}
      POSTGRES_HOST: host.docker.internal
      REDIS_HOST: redis-v2
      REDIS_HOST_PORT: 6379
      REDIS_DB_INDEX: 5
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_PASSWORD:?set NEXTCLOUD_PASSWORD in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost 127.0.0.1 nextcloud-web}
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      OVERWRITEPROTOCOL: ${NEXTCLOUD_PROTOCOL:-http}
      OVERWRITEHOST: ${NEXTCLOUD_HOST:-localhost:8602}
      TRUSTED_PROXIES: 172.16.0.0/12
    volumes:
      - ${NEXTCLOUD_CONFIG_DIR:-/var/lib/nextcloud-config}:/var/www/html
      - ${NEXTCLOUD_DATA_VOLUME:-/var/lib/nextcloud-data}:/var/www/html/data
    depends_on:
      redis-v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || pgrep php-fpm"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cap-v2-net

  nextcloud-web:
    image: nginx:alpine
    profiles: ["nextcloud"]
    volumes:
      - ${NEXTCLOUD_CONFIG_DIR:-/var/lib/nextcloud-config}:/var/www/html:ro
      - ./nginx/nextcloud.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NEXTCLOUD_PORT:-8602}:80"
    depends_on:
      - nextcloud-app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/status.php"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - cap-v2-net

networks:
  cap-v2-net:
    driver: bridge
